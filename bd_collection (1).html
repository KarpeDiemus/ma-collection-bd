<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ma BD">
<title>Ma Collection BD</title>
<style>
  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --surface2: #f0efe9;
    --text: #1a1a18;
    --text2: #6b6a64;
    --text3: #a09f98;
    --border: rgba(0,0,0,0.08);
    --border2: rgba(0,0,0,0.14);
    --accent: #1a4e8c;
    --accent-bg: #e8f0fa;
    --accent-text: #1a4e8c;
    --danger: #c00000;
    --danger-bg: #fdf0f0;
    --success: #1a6b3a;
    --success-bg: #edf7f1;
    --warning-bg: #fdf6e3;
    --warning-text: #7a5000;
    --radius: 10px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111110;
      --surface: #1c1c1a;
      --surface2: #242422;
      --text: #f0efe9;
      --text2: #9a9990;
      --text3: #5a5950;
      --border: rgba(255,255,255,0.08);
      --border2: rgba(255,255,255,0.14);
      --accent-bg: #0f2240;
      --accent-text: #6fa3dc;
      --danger-bg: #2a0a0a;
      --success-bg: #0a2018;
      --warning-bg: #1e1800;
      --warning-text: #c49a30;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, 'Helvetica Neue', sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; }

  /* ── Top bar ── */
  .topbar {
    background: var(--surface);
    border-bottom: 0.5px solid var(--border2);
    padding: calc(var(--safe-top) + 12px) 16px 0;
    flex-shrink: 0;
    z-index: 20;
  }
  .topbar-title {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .topbar-title h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.3px; }
  .sync-btn {
    width: 34px; height: 34px; border-radius: 50%; border: 0.5px solid var(--border2);
    background: var(--surface2); display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 16px; color: var(--text2);
  }
  .sync-btn.spinning { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .search-wrap { position: relative; margin-bottom: 12px; }
  .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text3); }
  #search {
    width: 100%; padding: 9px 10px 9px 34px; border-radius: var(--radius);
    border: 0.5px solid var(--border2); background: var(--surface2);
    font-size: 15px; color: var(--text); outline: none;
  }
  #search:focus { border-color: var(--accent); }

  /* ── Tabs ── */
  .tabs {
    display: flex; background: var(--surface);
    border-bottom: 0.5px solid var(--border2); flex-shrink: 0;
  }
  .tab {
    flex: 1; padding: 10px 4px; font-size: 13px; color: var(--text2);
    background: none; border: none; border-bottom: 2px solid transparent;
    cursor: pointer; font-weight: 400; transition: all 0.15s;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

  /* ── Filter chips ── */
  .chips-wrap {
    display: flex; gap: 6px; padding: 10px 16px; overflow-x: auto;
    background: var(--surface2); border-bottom: 0.5px solid var(--border);
    flex-shrink: 0; scrollbar-width: none;
  }
  .chips-wrap::-webkit-scrollbar { display: none; }
  .chip {
    padding: 5px 13px; border-radius: 20px; font-size: 12px; font-weight: 500;
    border: 0.5px solid var(--border2); background: var(--surface);
    color: var(--text2); cursor: pointer; white-space: nowrap; flex-shrink: 0;
  }
  .chip.active { background: var(--accent-bg); color: var(--accent-text); border-color: transparent; }

  /* ── List ── */
  .list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .section-hdr {
    padding: 8px 16px 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--text3);
    background: var(--bg); border-bottom: 0.5px solid var(--border);
    position: sticky; top: 0; z-index: 5;
  }
  .book-item {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 16px; border-bottom: 0.5px solid var(--border);
    background: var(--surface); cursor: pointer; user-select: none;
    transition: background 0.1s;
  }
  .book-item:active { background: var(--surface2); }
  .book-spine {
    width: 38px; height: 54px; border-radius: 3px 4px 4px 3px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 9px; font-weight: 700; text-align: center;
    padding: 3px; line-height: 1.2;
  }
  .book-info { flex: 1; min-width: 0; }
  .book-title { font-size: 14px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .book-sub { font-size: 12px; color: var(--text2); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badges { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
  .badge { font-size: 10px; font-weight: 500; padding: 2px 7px; border-radius: 10px; }
  .b-pub { background: var(--surface2); color: var(--text2); border: 0.5px solid var(--border2); }
  .b-owned { background: var(--success-bg); color: var(--success); }
  .b-missing { background: var(--danger-bg); color: var(--danger); }
  .b-warn { background: var(--warning-bg); color: var(--warning-text); }
  .check-btn {
    width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--border2);
    background: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; color: var(--text3); font-size: 14px;
    transition: all 0.15s;
  }
  .check-btn.on { background: var(--success); border-color: var(--success); color: #fff; }
  .chevron { color: var(--text3); font-size: 14px; flex-shrink: 0; }
  .empty { text-align: center; padding: 70px 24px; color: var(--text3); }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }
  .empty p { font-size: 15px; }

  /* ── Stats ── */
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 14px 16px; }
  .stat-card { background: var(--surface); border-radius: var(--radius); padding: 14px; border: 0.5px solid var(--border); }
  .stat-num { font-size: 26px; font-weight: 700; color: var(--text); }
  .stat-lbl { font-size: 11px; color: var(--text2); margin-top: 3px; }
  .stats-section { padding: 0 16px 16px; }
  .stats-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text3); padding: 14px 0 8px; }
  .bar-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 0.5px solid var(--border); gap: 12px; }
  .bar-label { font-size: 13px; color: var(--text); min-width: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { width: 80px; height: 6px; background: var(--surface2); border-radius: 3px; flex-shrink: 0; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; }
  .bar-count { font-size: 12px; color: var(--text2); font-weight: 600; width: 28px; text-align: right; flex-shrink: 0; }

  /* ── Bottom sheet ── */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 100; display: none; align-items: flex-end; }
  .overlay.open { display: flex; }
  .sheet {
    background: var(--surface); border-radius: 18px 18px 0 0; width: 100%;
    max-height: 80vh; overflow-y: auto; padding: 0 20px calc(var(--safe-bottom) + 28px);
  }
  .sheet-handle { width: 36px; height: 4px; background: var(--border2); border-radius: 2px; margin: 12px auto 18px; }
  .sheet-title { font-size: 18px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
  .sheet-sub { font-size: 14px; color: var(--accent-text); margin-bottom: 18px; }
  .sheet-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 10px 0; border-bottom: 0.5px solid var(--border); gap: 12px; }
  .sheet-row:last-of-type { border: none; }
  .s-label { font-size: 13px; color: var(--text2); flex-shrink: 0; }
  .s-val { font-size: 13px; font-weight: 500; color: var(--text); text-align: right; max-width: 65%; word-break: break-word; }
  .sheet-actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn-main { flex: 1; padding: 13px; border-radius: var(--radius); background: var(--accent); color: #fff; border: none; font-size: 15px; font-weight: 600; cursor: pointer; }
  .btn-ghost { padding: 13px 16px; border-radius: var(--radius); background: none; color: var(--text2); border: 0.5px solid var(--border2); font-size: 15px; cursor: pointer; }
  .btn-danger { padding: 13px 16px; border-radius: var(--radius); background: var(--danger-bg); color: var(--danger); border: none; font-size: 15px; cursor: pointer; }

  /* ── Add form ── */
  .form-field { width: 100%; margin-bottom: 10px; font-size: 15px; padding: 11px 13px; border-radius: var(--radius); border: 0.5px solid var(--border2); background: var(--surface2); color: var(--text); outline: none; -webkit-appearance: none; }
  .form-field:focus { border-color: var(--accent); }
  .form-label { font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 4px; display: block; text-transform: uppercase; letter-spacing: 0.05em; }

  /* ── FAB ── */
  .fab { position: fixed; bottom: calc(var(--safe-bottom) + 20px); right: 20px; width: 54px; height: 54px; border-radius: 50%; background: var(--accent); color: #fff; border: none; font-size: 26px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px rgba(26,78,140,0.35); z-index: 50; }

  /* ── Toast ── */
  .toast { position: fixed; bottom: calc(var(--safe-bottom) + 88px); left: 50%; transform: translateX(-50%); background: #222; color: #fff; font-size: 13px; padding: 9px 18px; border-radius: 20px; opacity: 0; pointer-events: none; transition: opacity 0.25s; white-space: nowrap; z-index: 200; }
  .toast.show { opacity: 1; }

  /* ── Setup screen ── */
  .setup-screen { position: fixed; inset: 0; background: var(--bg); z-index: 300; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .setup-card { background: var(--surface); border-radius: 16px; padding: 28px 24px; max-width: 400px; width: 100%; border: 0.5px solid var(--border2); }
  .setup-card h2 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .setup-card p { font-size: 14px; color: var(--text2); margin-bottom: 20px; line-height: 1.5; }
  .setup-card .form-field { margin-bottom: 14px; }

  /* ── Config panel ── */
  .cfg-badge { font-size: 10px; background: var(--success-bg); color: var(--success); padding: 3px 8px; border-radius: 10px; font-weight: 600; }
  .cfg-badge.disconnected { background: var(--danger-bg); color: var(--danger); }
</style>
</head>
<body>

<!-- Setup screen (shown until URL is configured) -->
<div class="setup-screen" id="setup-screen">
  <div class="setup-card">
    <div style="font-size:36px;margin-bottom:12px">📚</div>
    <h2>Ma Collection BD</h2>
    <p>Collez l'URL de votre Google Apps Script pour connecter l'app à votre Google Sheet.</p>
    <label class="form-label">URL du Web App Google</label>
    <input class="form-field" id="setup-url" type="url" placeholder="https://script.google.com/macros/s/…/exec">
    <button class="btn-main" style="width:100%;margin-top:4px" onclick="saveConfig()">Connecter</button>
    <p style="margin-top:14px;font-size:12px;color:var(--text3)">Voir les instructions dans le fichier <code>google_apps_script.js</code> fourni.</p>
  </div>
</div>

<!-- Main app -->
<div class="topbar">
  <div class="topbar-title">
    <h1>📚 Ma Collection BD</h1>
    <button class="sync-btn" id="sync-btn" onclick="syncData()" title="Synchroniser">↻</button>
  </div>
  <div class="search-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input id="search" type="search" placeholder="Rechercher titre, série, auteur…" oninput="render()">
  </div>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('owned',this)">Possédés <span id="cnt-owned"></span></button>
  <button class="tab" onclick="switchTab('missing',this)">Manquants <span id="cnt-missing"></span></button>
  <button class="tab" onclick="switchTab('stats',this)">Stats</button>
  <button class="tab" onclick="switchTab('config',this)">⚙</button>
</div>

<div class="chips-wrap" id="chips"></div>
<div class="list" id="list"></div>

<button class="fab" onclick="openAdd()" id="fab" aria-label="Ajouter">+</button>

<!-- Detail / add sheet -->
<div class="overlay" id="overlay" onclick="overlayClick(event)">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div id="sheet-content"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── State ───────────────────────────────────────────────────
const SCRIPT_URL_KEY = 'bd_script_url';
let SCRIPT_URL = localStorage.getItem(SCRIPT_URL_KEY) || '';

let ownedData   = [];
let missingData = [];
let currentTab  = 'owned';
let activeFilter = 'Tous';

// ─── Publisher colours ───────────────────────────────────────
const PUB_COLORS = {
  'Lombard':          { bg:'#e8f0fa', fg:'#1a4e8c', bar:'#1a4e8c' },
  'Glénat':           { bg:'#fdf0e6', fg:'#c55a11', bar:'#c55a11' },
  'Dupuis':           { bg:'#f5e8fa', fg:'#7b2d8c', bar:'#7b2d8c' },
  'Dargaud':          { bg:'#fde8e8', fg:'#c00000', bar:'#c00000' },
  'Blake & Mortimer': { bg:'#e8f5ee', fg:'#1f5c3a', bar:'#1f5c3a' },
  'Casterman':        { bg:'#fdf5e0', fg:'#8c6d1a', bar:'#8c6d1a' },
  'Albert René':      { bg:'#fef0e0', fg:'#b35900', bar:'#b35900' },
  'Fluide Glacial':   { bg:'#eef5e8', fg:'#2e7d32', bar:'#2e7d32' },
};
function pubColor(pub) { return PUB_COLORS[pub] || { bg:'#f0f0ec', fg:'#555', bar:'#888' }; }
function initials(s) {
  const words = s.split(/\s+/).filter(w => w.length > 2);
  return (words.slice(0,2).map(w=>w[0]).join('') || s.slice(0,2)).toUpperCase();
}

// ─── Setup / Config ──────────────────────────────────────────
function saveConfig() {
  const url = document.getElementById('setup-url').value.trim();
  if (!url.startsWith('https://script.google.com')) { toast('URL invalide'); return; }
  SCRIPT_URL = url;
  localStorage.setItem(SCRIPT_URL_KEY, url);
  document.getElementById('setup-screen').style.display = 'none';
  toast('Connecté ✓');
  syncData();
}

function checkSetup() {
  if (!SCRIPT_URL) {
    document.getElementById('setup-screen').style.display = 'flex';
  } else {
    document.getElementById('setup-screen').style.display = 'none';
    syncData();
  }
}

// ─── Sync ────────────────────────────────────────────────────
async function syncData() {
  if (!SCRIPT_URL) return;
  const btn = document.getElementById('sync-btn');
  btn.classList.add('spinning');
  try {
    const res = await fetch(SCRIPT_URL + '?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    ownedData   = data.owned   || [];
    missingData = data.missing || [];
    // Normalise acquired field
    missingData.forEach(m => { m.acquired = m.acquired === true || m.acquired === 'TRUE' || m.acquired === 'true'; });
    updateCounts();
    render();
    toast('Synchronisé ✓');
  } catch(e) {
    toast('Erreur de synchronisation');
    console.error(e);
  }
  btn.classList.remove('spinning');
}

async function post(body) {
  if (!SCRIPT_URL) return;
  await fetch(SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify(body),
    headers: { 'Content-Type': 'application/json' }
  });
}

// ─── UI helpers ──────────────────────────────────────────────
function toast(msg, dur=2200) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur);
}

function updateCounts() {
  document.getElementById('cnt-owned').textContent   = ownedData.length   ? `(${ownedData.length})`   : '';
  document.getElementById('cnt-missing').textContent = missingData.length ? `(${missingData.filter(m=>!m.acquired).length})` : '';
}

function switchTab(tab, el) {
  currentTab  = tab;
  activeFilter = 'Tous';
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('fab').style.display = tab === 'stats' || tab === 'config' ? 'none' : 'flex';
  render();
}

function setFilter(s) { activeFilter = s; render(); }

function overlayClick(e) {
  if (e.target === document.getElementById('overlay')) closeSheet();
}
function closeSheet() { document.getElementById('overlay').classList.remove('open'); }

// ─── Data helpers ─────────────────────────────────────────────
function getSeriesList(data) {
  return ['Tous', ...[...new Set(data.map(d=>d.series))].sort()];
}

function filterData(data) {
  const q = document.getElementById('search').value.toLowerCase();
  return data.filter(item => {
    const matchSeries = activeFilter === 'Tous' || item.series === activeFilter;
    if (!q) return matchSeries;
    const hay = Object.values(item).join(' ').toLowerCase();
    return matchSeries && hay.includes(q);
  });
}

function groupBy(arr, key) {
  const g = {};
  arr.forEach(i => { if (!g[i[key]]) g[i[key]] = []; g[i[key]].push(i); });
  return g;
}

// ─── Render ──────────────────────────────────────────────────
function render() {
  renderChips();
  if (currentTab === 'stats')  { renderStats();  return; }
  if (currentTab === 'config') { renderConfig(); return; }

  const data     = currentTab === 'owned' ? ownedData : missingData;
  const filtered = filterData(data);
  const groups   = groupBy(filtered, 'series');
  const list     = document.getElementById('list');

  if (!filtered.length) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><p>Aucun résultat</p></div>`;
    return;
  }

  let html = '';
  Object.keys(groups).sort().forEach(series => {
    html += `<div class="section-hdr">${esc(series)} <span style="font-weight:400;opacity:.6">(${groups[series].length})</span></div>`;
    groups[series].forEach(item => {
      html += currentTab === 'owned' ? renderOwned(item) : renderMissing(item);
    });
  });
  list.innerHTML = html;
}

function renderOwned(item) {
  const c = pubColor(item.publisher);
  const tome = item.tome && item.tome !== '-' ? ` — T.${item.tome}` : '';
  return `<div class="book-item" onclick="openDetail('${esc(item.id)}','owned')">
    <div class="book-spine" style="background:${c.bg};color:${c.fg}">${initials(item.series)}</div>
    <div class="book-info">
      <div class="book-title">${esc(item.title)}${esc(tome)}</div>
      <div class="book-sub">${esc(item.authors||'')}</div>
      <div class="badges">
        <span class="badge b-pub">${esc(item.publisher)}</span>
        <span class="badge b-owned">Possédé</span>
      </div>
    </div>
    <span class="chevron">›</span>
  </div>`;
}

function renderMissing(item) {
  const priBadge = item.priority === '★★★' ? 'b-missing' : item.priority === '★★' ? 'b-warn' : 'b-pub';
  const strike = item.acquired ? 'style="text-decoration:line-through;opacity:.5"' : '';
  return `<div class="book-item" onclick="openDetail('${esc(item.id)}','missing')">
    <div style="width:38px;height:54px;border-radius:3px;background:${item.acquired?'var(--success-bg)':'var(--danger-bg)'};display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px">
      ${item.acquired ? '✅' : '📋'}
    </div>
    <div class="book-info">
      <div class="book-title" ${strike}>${esc(item.missing)}</div>
      <div class="book-sub">${esc(item.authors||'')}</div>
      <div class="badges">
        <span class="badge b-pub">${esc(item.publisher)}</span>
        <span class="badge ${priBadge}">${esc(item.priority)}</span>
        ${item.acquired ? '<span class="badge b-owned">Acquis ✓</span>' : ''}
      </div>
    </div>
    <button class="check-btn ${item.acquired?'on':''}" onclick="toggleAcquired(event,'${esc(item.id)}')">✓</button>
  </div>`;
}

function renderChips() {
  if (currentTab === 'stats' || currentTab === 'config') {
    document.getElementById('chips').innerHTML = ''; return;
  }
  const data = currentTab === 'owned' ? ownedData : missingData;
  const series = getSeriesList(data);
  document.getElementById('chips').innerHTML = series.map(s =>
    `<button class="chip ${s===activeFilter?'active':''}" onclick="setFilter(${JSON.stringify(s)})">${esc(s)}</button>`
  ).join('');
}

function renderStats() {
  const serCounts = {};
  ownedData.forEach(b => { serCounts[b.series] = (serCounts[b.series]||0)+1; });
  const pubCounts = {};
  ownedData.forEach(b => { pubCounts[b.publisher] = (pubCounts[b.publisher]||0)+1; });
  const topSeries = Object.entries(serCounts).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const topPubs   = Object.entries(pubCounts).sort((a,b)=>b[1]-a[1]);
  const maxS = topSeries[0]?.[1] || 1;
  const maxP = topPubs[0]?.[1] || 1;
  const acquiredCount = missingData.filter(m=>m.acquired).length;

  document.getElementById('chips').innerHTML = '';
  document.getElementById('list').innerHTML = `
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-num">${ownedData.length}</div><div class="stat-lbl">Albums possédés</div></div>
      <div class="stat-card"><div class="stat-num">${missingData.filter(m=>!m.acquired).length}</div><div class="stat-lbl">Albums manquants</div></div>
      <div class="stat-card"><div class="stat-num">${Object.keys(serCounts).length}</div><div class="stat-lbl">Séries</div></div>
      <div class="stat-card"><div class="stat-num">${acquiredCount}</div><div class="stat-lbl">Manquants acquis</div></div>
    </div>
    <div class="stats-section">
      <div class="stats-title">Top séries</div>
      ${topSeries.map(([s,n])=>`
        <div class="bar-row">
          <span class="bar-label">${esc(s)}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.round(n/maxS*100)}%;background:var(--accent)"></div></div>
          <span class="bar-count">${n}</span>
        </div>`).join('')}
      <div class="stats-title" style="margin-top:8px">Par éditeur</div>
      ${topPubs.map(([p,n])=>{const c=pubColor(p);return`
        <div class="bar-row">
          <span class="bar-label">${esc(p)}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.round(n/maxP*100)}%;background:${c.bar}"></div></div>
          <span class="bar-count">${n}</span>
        </div>`;}).join('')}
    </div>`;
}

function renderConfig() {
  const connected = !!SCRIPT_URL;
  document.getElementById('chips').innerHTML = '';
  document.getElementById('list').innerHTML = `
    <div style="padding:20px 16px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
        <span style="font-size:16px;font-weight:600">Google Sheet</span>
        <span class="cfg-badge ${connected?'':'disconnected'}">${connected?'Connecté':'Non connecté'}</span>
      </div>
      ${connected ? `<div style="font-size:12px;color:var(--text3);word-break:break-all;margin-bottom:16px">${esc(SCRIPT_URL)}</div>` : ''}
      <label class="form-label">URL Web App</label>
      <input class="form-field" id="cfg-url" type="url" value="${esc(SCRIPT_URL)}" placeholder="https://script.google.com/macros/s/…/exec">
      <button class="btn-main" style="width:100%;margin-top:8px" onclick="updateConfig()">Mettre à jour</button>
      ${connected?`<button class="btn-ghost" style="width:100%;margin-top:10px" onclick="syncData();toast('Synchronisation…')">↻ Synchroniser maintenant</button>`:''}
      <div style="margin-top:24px;padding-top:16px;border-top:0.5px solid var(--border)">
        <p style="font-size:13px;color:var(--text2);line-height:1.6">
          Cette app est liée à votre Google Sheet via un Apps Script.<br><br>
          Pour modifier le Sheet directement, ouvrez Google Sheets sur votre iPhone. Toutes les modifications faites ici sont sauvegardées en temps réel dans votre compte Google.
        </p>
      </div>
    </div>`;
}

function updateConfig() {
  const url = document.getElementById('cfg-url').value.trim();
  if (!url) { SCRIPT_URL = ''; localStorage.removeItem(SCRIPT_URL_KEY); toast('Déconnecté'); render(); return; }
  if (!url.startsWith('https://script.google.com')) { toast('URL invalide'); return; }
  SCRIPT_URL = url;
  localStorage.setItem(SCRIPT_URL_KEY, url);
  toast('URL mise à jour ✓');
  syncData();
}

// ─── Detail sheet ─────────────────────────────────────────────
function openDetail(id, type) {
  const item = type === 'owned'
    ? ownedData.find(i => String(i.id) === String(id))
    : missingData.find(i => String(i.id) === String(id));
  if (!item) return;

  let html = '';
  if (type === 'owned') {
    const tome = item.tome && item.tome !== '-' ? item.tome : '—';
    html = `
      <div class="sheet-title">${esc(item.title)}</div>
      <div class="sheet-sub">${esc(item.series)}</div>
      <div class="sheet-row"><span class="s-label">Tome</span><span class="s-val">${esc(tome)}</span></div>
      <div class="sheet-row"><span class="s-label">Éditeur</span><span class="s-val">${esc(item.publisher||'—')}</span></div>
      <div class="sheet-row"><span class="s-label">Auteur(s)</span><span class="s-val">${esc(item.authors||'—')}</span></div>
      <div class="sheet-row"><span class="s-label">Rayon</span><span class="s-val">${esc(item.shelf||'—')}</span></div>
      <div class="sheet-actions">
        <button class="btn-danger" onclick="deleteItem('${esc(id)}','owned')">Supprimer</button>
        <button class="btn-main" onclick="closeSheet()">Fermer</button>
      </div>`;
  } else {
    html = `
      <div class="sheet-title">${esc(item.missing)}</div>
      <div class="sheet-sub">${esc(item.series)}</div>
      <div class="sheet-row"><span class="s-label">Éditeur</span><span class="s-val">${esc(item.publisher||'—')}</span></div>
      <div class="sheet-row"><span class="s-label">Auteur(s)</span><span class="s-val">${esc(item.authors||'—')}</span></div>
      <div class="sheet-row"><span class="s-label">Priorité</span><span class="s-val">${esc(item.priority||'—')}</span></div>
      <div class="sheet-row"><span class="s-label">Notes</span><span class="s-val">${esc(item.notes||'—')}</span></div>
      <div class="sheet-row"><span class="s-label">Statut</span><span class="s-val" style="color:${item.acquired?'var(--success)':'var(--danger)'}">${item.acquired?'Acquis ✓':'Non acquis'}</span></div>
      <div class="sheet-actions">
        <button class="btn-danger" onclick="deleteItem('${esc(id)}','missing')">Supprimer</button>
        <button class="btn-main" onclick="toggleAcquiredFromDetail('${esc(id)}')">${item.acquired?'Marquer non acquis':'Marquer acquis ✓'}</button>
      </div>`;
  }
  document.getElementById('sheet-content').innerHTML = html;
  document.getElementById('overlay').classList.add('open');
}

// ─── Actions ──────────────────────────────────────────────────
async function toggleAcquired(e, id) {
  e.stopPropagation();
  const item = missingData.find(i => String(i.id) === String(id));
  if (!item) return;
  item.acquired = !item.acquired;
  updateCounts(); render();
  await post({ action: 'toggle_acquired', id, value: item.acquired });
  toast(item.acquired ? 'Marqué acquis ✓' : 'Marqué non acquis');
}

async function toggleAcquiredFromDetail(id) {
  const item = missingData.find(i => String(i.id) === String(id));
  if (!item) return;
  item.acquired = !item.acquired;
  closeSheet(); updateCounts(); render();
  await post({ action: 'toggle_acquired', id, value: item.acquired });
  toast(item.acquired ? 'Marqué acquis ✓' : 'Marqué non acquis');
}

async function deleteItem(id, type) {
  if (!confirm('Supprimer cet album ?')) return;
  if (type === 'owned') ownedData   = ownedData.filter(i   => String(i.id) !== String(id));
  else                  missingData = missingData.filter(i => String(i.id) !== String(id));
  closeSheet(); updateCounts(); render();
  await post({ action: 'delete', id, type });
  toast('Supprimé');
}

function openAdd() {
  const isM = currentTab === 'missing';
  document.getElementById('sheet-content').innerHTML = `
    <div class="sheet-title">${isM ? 'Ajouter un manquant' : 'Ajouter un album'}</div>
    <div style="height:14px"></div>
    <label class="form-label">Série *</label>
    <input class="form-field" id="f-series" placeholder="ex. Blake & Mortimer">
    <label class="form-label">${isM ? 'Tome(s) manquant(s) *' : 'Titre *'}</label>
    <input class="form-field" id="f-title" placeholder="${isM ? 'ex. 1 – L\'Espadon' : 'ex. La Marque Jaune'}">
    ${!isM ? `<label class="form-label">Tome N°</label><input class="form-field" id="f-tome" placeholder="ex. 5">` : ''}
    <label class="form-label">Éditeur</label>
    <input class="form-field" id="f-pub" placeholder="ex. Blake & Mortimer">
    <label class="form-label">Auteur(s)</label>
    <input class="form-field" id="f-authors" placeholder="ex. E.P. Jacobs">
    ${isM ? `<label class="form-label">Priorité</label>
    <select class="form-field" id="f-priority">
      <option value="★★★">★★★ Urgent</option>
      <option value="★★" selected>★★ Souhaité</option>
      <option value="★">★ Optionnel</option>
    </select>` : ''}
    <label class="form-label">Notes</label>
    <input class="form-field" id="f-notes" placeholder="Remarques…">
    <div class="sheet-actions">
      <button class="btn-ghost" onclick="closeSheet()">Annuler</button>
      <button class="btn-main" onclick="saveNew(${isM})">Ajouter</button>
    </div>`;
  document.getElementById('overlay').classList.add('open');
}

async function saveNew(isMissing) {
  const series = document.getElementById('f-series').value.trim();
  const title  = document.getElementById('f-title').value.trim();
  if (!series || !title) { toast('Série et titre requis'); return; }
  const id = (isMissing?'m':'o') + Date.now();
  const notes = document.getElementById('f-notes').value.trim();
  const pub   = document.getElementById('f-pub').value.trim();
  const auth  = document.getElementById('f-authors').value.trim();

  if (isMissing) {
    const item = { id, series, missing: title, publisher: pub, authors: auth,
      priority: document.getElementById('f-priority').value,
      acquired: false, notes };
    missingData.push(item);
    closeSheet(); updateCounts(); render();
    await post({ action: 'add_missing', item });
  } else {
    const item = { id, series, title,
      tome: (document.getElementById('f-tome').value.trim() || '-'),
      publisher: pub, authors: auth, shelf: 'Manuel', notes };
    ownedData.push(item);
    closeSheet(); updateCounts(); render();
    await post({ action: 'add_owned', item });
  }
  toast('Ajouté ✓');
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── Boot ────────────────────────────────────────────────────
checkSetup();
</script>
</body>
</html>
