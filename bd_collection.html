<index.html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ma BD">
<title>Ma Collection BD</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg:#f5f4f0;--surface:#fff;--surface2:#f0efe9;--text:#1a1a18;--text2:#6b6a64;--text3:#a09f98;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.14);
  --accent:#1a4e8c;--accent-bg:#e8f0fa;--accent-text:#1a4e8c;
  --danger:#c00000;--danger-bg:#fdf0f0;--success:#1a6b3a;--success-bg:#edf7f1;
  --warning-bg:#fdf6e3;--warning-text:#7a5000;
  --radius:10px;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){
  :root{--bg:#111110;--surface:#1c1c1a;--surface2:#242422;--text:#f0efe9;--text2:#9a9990;--text3:#5a5950;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
  --accent-bg:#0f2240;--accent-text:#6fa3dc;--danger-bg:#2a0a0a;--success-bg:#0a2018;
  --warning-bg:#1e1800;--warning-text:#c49a30;}
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,'Helvetica Neue',sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}

.topbar{background:var(--surface);border-bottom:.5px solid var(--border2);padding:calc(var(--safe-top) + 12px) 16px 0;flex-shrink:0;z-index:20}
.topbar-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.topbar-title h1{font-size:20px;font-weight:600;letter-spacing:-.3px}
.sync-btn{width:34px;height:34px;border-radius:50%;border:.5px solid var(--border2);background:var(--surface2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;color:var(--text2)}
.sync-btn.spinning{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.search-wrap{position:relative;margin-bottom:12px}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
#search{width:100%;padding:9px 10px 9px 34px;border-radius:var(--radius);border:.5px solid var(--border2);background:var(--surface2);font-size:15px;color:var(--text);outline:none}
#search:focus{border-color:var(--accent)}

.tabs{display:flex;background:var(--surface);border-bottom:.5px solid var(--border2);flex-shrink:0}
.tab{flex:1;padding:10px 4px;font-size:12px;color:var(--text2);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;font-weight:400;transition:all .15s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

.chips-wrap{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;background:var(--surface2);border-bottom:.5px solid var(--border);flex-shrink:0;scrollbar-width:none}
.chips-wrap::-webkit-scrollbar{display:none}
.chip{padding:5px 13px;border-radius:20px;font-size:12px;font-weight:500;border:.5px solid var(--border2);background:var(--surface);color:var(--text2);cursor:pointer;white-space:nowrap;flex-shrink:0}
.chip.active{background:var(--accent-bg);color:var(--accent-text);border-color:transparent}

.list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.section-hdr{padding:8px 16px 4px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);background:var(--bg);border-bottom:.5px solid var(--border);position:sticky;top:0;z-index:5}

.book-item{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:.5px solid var(--border);background:var(--surface);cursor:pointer;transition:background .1s}
.book-item:active{background:var(--surface2)}
.cover-wrap{width:40px;height:56px;border-radius:3px 5px 5px 3px;flex-shrink:0;overflow:hidden;position:relative;box-shadow:2px 2px 6px rgba(0,0,0,.15)}
.cover-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.cover-spine{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;text-align:center;padding:3px;line-height:1.2}
.book-info{flex:1;min-width:0}
.book-title{font-size:14px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book-sub{font-size:12px;color:var(--text2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badges{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.badge{font-size:10px;font-weight:500;padding:2px 7px;border-radius:10px}
.b-pub{background:var(--surface2);color:var(--text2);border:.5px solid var(--border2)}
.b-owned{background:var(--success-bg);color:var(--success)}
.b-missing{background:var(--danger-bg);color:var(--danger)}
.b-warn{background:var(--warning-bg);color:var(--warning-text)}
.check-btn{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--border2);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text3);font-size:14px;transition:all .15s}
.check-btn.on{background:var(--success);border-color:var(--success);color:#fff}
.chevron{color:var(--text3);font-size:16px;flex-shrink:0}
.empty{text-align:center;padding:70px 24px;color:var(--text3)}
.empty-icon{font-size:40px;margin-bottom:12px}

/* Stats */
.stats-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:80px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 16px}
.stat-card{background:var(--surface);border-radius:var(--radius);padding:14px;border:.5px solid var(--border)}
.stat-num{font-size:26px;font-weight:700;color:var(--text)}
.stat-lbl{font-size:11px;color:var(--text2);margin-top:3px}
.chart-card{background:var(--surface);border-radius:var(--radius);padding:16px;margin:0 16px 14px;border:.5px solid var(--border)}
.chart-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:12px}
.chart-wrap{position:relative;height:200px}
.completion-card{background:var(--surface);border-radius:var(--radius);padding:16px;margin:0 16px 14px;border:.5px solid var(--border)}
.comp-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:.5px solid var(--border)}
.comp-row:last-child{border:none}
.comp-name{font-size:12px;color:var(--text);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.comp-track{flex:1;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;max-width:80px}
.comp-fill{height:100%;border-radius:3px;background:var(--accent)}
.comp-pct{font-size:11px;font-weight:600;color:var(--text2);width:32px;text-align:right;flex-shrink:0}

/* Bottom sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:none;align-items:flex-end}
.overlay.open{display:flex}
.sheet{background:var(--surface);border-radius:18px 18px 0 0;width:100%;max-height:88vh;overflow-y:auto;padding:0 20px calc(var(--safe-bottom) + 28px)}
.sheet-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:12px auto 18px}
.sheet-title{font-size:18px;font-weight:600;color:var(--text);margin-bottom:2px}
.sheet-sub{font-size:14px;color:var(--accent-text);margin-bottom:16px}

/* Detail cover */
.detail-cover{width:100%;height:180px;border-radius:var(--radius);overflow:hidden;margin-bottom:16px;position:relative;display:flex;align-items:center;justify-content:center}
.detail-cover img{width:100%;height:100%;object-fit:cover}
.detail-cover-spine{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;letter-spacing:1px}

.sheet-row{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 0;border-bottom:.5px solid var(--border);gap:12px}
.sheet-row:last-of-type{border:none}
.s-label{font-size:13px;color:var(--text2);flex-shrink:0}
.s-val{font-size:13px;font-weight:500;color:var(--text);text-align:right;max-width:65%;word-break:break-word}
.sheet-actions{display:flex;gap:10px;margin-top:20px}
.btn-main{flex:1;padding:13px;border-radius:var(--radius);background:var(--accent);color:#fff;border:none;font-size:15px;font-weight:600;cursor:pointer}
.btn-ghost{padding:13px 16px;border-radius:var(--radius);background:none;color:var(--text2);border:.5px solid var(--border2);font-size:15px;cursor:pointer}
.btn-danger{padding:13px 16px;border-radius:var(--radius);background:var(--danger-bg);color:var(--danger);border:none;font-size:15px;cursor:pointer}
.btn-edit{padding:13px 16px;border-radius:var(--radius);background:var(--accent-bg);color:var(--accent-text);border:none;font-size:15px;cursor:pointer}

/* Form */
.form-field{width:100%;margin-bottom:10px;font-size:15px;padding:11px 13px;border-radius:var(--radius);border:.5px solid var(--border2);background:var(--surface2);color:var(--text);outline:none;-webkit-appearance:none}
.form-field:focus{border-color:var(--accent)}
.form-label{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:4px;display:block;text-transform:uppercase;letter-spacing:.05em}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Cover preview in form */
.cover-preview{width:100%;height:120px;border-radius:var(--radius);overflow:hidden;margin-bottom:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;border:.5px dashed var(--border2)}
.cover-preview img{width:100%;height:100%;object-fit:cover}
.cover-preview-placeholder{color:var(--text3);font-size:13px;text-align:center;padding:16px}

.fab{position:fixed;bottom:calc(var(--safe-bottom) + 20px);right:20px;width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(26,78,140,.35);z-index:50}
.toast{position:fixed;bottom:calc(var(--safe-bottom) + 88px);left:50%;transform:translateX(-50%);background:#222;color:#fff;font-size:13px;padding:9px 18px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap;z-index:200}
.toast.show{opacity:1}

.setup-screen{position:fixed;inset:0;background:var(--bg);z-index:300;display:flex;align-items:center;justify-content:center;padding:24px}
.setup-card{background:var(--surface);border-radius:16px;padding:28px 24px;max-width:400px;width:100%;border:.5px solid var(--border2)}
.setup-card h2{font-size:20px;font-weight:700;margin-bottom:8px}
.setup-card p{font-size:14px;color:var(--text2);margin-bottom:20px;line-height:1.5}
.cfg-badge{font-size:10px;background:var(--success-bg);color:var(--success);padding:3px 8px;border-radius:10px;font-weight:600}
.cfg-badge.disconnected{background:var(--danger-bg);color:var(--danger)}
</style>
</head>
<body>

<div class="setup-screen" id="setup-screen">
  <div class="setup-card">
    <div style="font-size:36px;margin-bottom:12px">📚</div>
    <h2>Ma Collection BD</h2>
    <p>Collez l'URL de votre Google Apps Script pour connecter l'app à votre Google Sheet.</p>
    <label class="form-label">URL du Web App Google</label>
    <input class="form-field" id="setup-url" type="url" placeholder="https://script.google.com/macros/s/…/exec">
    <button class="btn-main" style="width:100%;margin-top:4px" onclick="saveConfig()">Connecter</button>
  </div>
</div>

<div class="topbar">
  <div class="topbar-title">
    <h1>📚 Ma Collection BD</h1>
    <button class="sync-btn" id="sync-btn" onclick="syncData()" title="Synchroniser">↻</button>
  </div>
  <div class="search-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input id="search" type="search" placeholder="Rechercher titre, série, auteur…" oninput="render()">
  </div>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('owned',this)">Possédés <span id="cnt-owned"></span></button>
  <button class="tab" onclick="switchTab('missing',this)">Manquants <span id="cnt-missing"></span></button>
  <button class="tab" onclick="switchTab('stats',this)">Stats</button>
  <button class="tab" onclick="switchTab('config',this)">⚙</button>
</div>

<div class="chips-wrap" id="chips"></div>
<div class="list" id="list"></div>
<button class="fab" onclick="openAdd()" id="fab" aria-label="Ajouter">+</button>

<div class="overlay" id="overlay" onclick="overlayClick(event)">
  <div class="sheet"><div class="sheet-handle"></div><div id="sheet-content"></div></div>
</div>

<div class="toast" id="toast"></div>

<script>
const SCRIPT_URL_KEY = 'bd_script_url';
let SCRIPT_URL = localStorage.getItem(SCRIPT_URL_KEY) || '';
let ownedData = [], missingData = [];
let currentTab = 'owned', activeFilter = 'Tous';
let chartPub = null, chartProgress = null;

const PUB_COLORS = {
  'Lombard':          {bg:'#e8f0fa',fg:'#1a4e8c',bar:'#1a4e8c'},
  'Glénat':           {bg:'#fdf0e6',fg:'#c55a11',bar:'#c55a11'},
  'Dupuis':           {bg:'#f5e8fa',fg:'#7b2d8c',bar:'#7b2d8c'},
  'Dargaud':          {bg:'#fde8e8',fg:'#c00000',bar:'#c00000'},
  'Blake & Mortimer': {bg:'#e8f5ee',fg:'#1f5c3a',bar:'#1f5c3a'},
  'Casterman':        {bg:'#fdf5e0',fg:'#8c6d1a',bar:'#8c6d1a'},
  'Albert René':      {bg:'#fef0e0',fg:'#b35900',bar:'#b35900'},
  'Fluide Glacial':   {bg:'#eef5e8',fg:'#2e7d32',bar:'#2e7d32'},
};
function pubColor(pub){return PUB_COLORS[pub]||{bg:'#f0f0ec',fg:'#555',bar:'#888'}}
function initials(s){return(s.split(/\s+/).filter(w=>w.length>2).slice(0,2).map(w=>w[0]).join('')||s.slice(0,2)).toUpperCase()}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

// ── Config ───────────────────────────────────────────────────
function saveConfig(){
  const url=document.getElementById('setup-url').value.trim();
  if(!url.startsWith('https://script.google.com')){toast('URL invalide');return}
  SCRIPT_URL=url;localStorage.setItem(SCRIPT_URL_KEY,url);
  document.getElementById('setup-screen').style.display='none';
  toast('Connecté ✓');syncData();
}
function checkSetup(){
  if(!SCRIPT_URL)document.getElementById('setup-screen').style.display='flex';
  else{document.getElementById('setup-screen').style.display='none';syncData()}
}

// ── Sync ─────────────────────────────────────────────────────
async function syncData(){
  if(!SCRIPT_URL)return;
  const btn=document.getElementById('sync-btn');
  btn.classList.add('spinning');
  try{
    const res=await fetch(SCRIPT_URL+'?t='+Date.now());
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    ownedData=data.owned||[];
    missingData=data.missing||[];
    missingData.forEach(m=>{m.acquired=m.acquired===true||m.acquired==='TRUE'||m.acquired==='true'});
    updateCounts();render();toast('Synchronisé ✓');
  }catch(e){toast('Erreur de synchronisation');console.error(e)}
  btn.classList.remove('spinning');
}
async function post(body){
  if(!SCRIPT_URL)return;
  await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify(body),headers:{'Content-Type':'application/json'}});
}

// ── UI helpers ───────────────────────────────────────────────
function toast(msg,dur=2200){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),dur);
}
function updateCounts(){
  document.getElementById('cnt-owned').textContent=ownedData.length?`(${ownedData.length})`:'';
  document.getElementById('cnt-missing').textContent=missingData.length?`(${missingData.filter(m=>!m.acquired).length})`:'';
}
function switchTab(tab,el){
  currentTab=tab;activeFilter='Tous';
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('fab').style.display=(tab==='stats'||tab==='config')?'none':'flex';
  render();
}
function setFilter(s){activeFilter=s;render()}
function overlayClick(e){if(e.target===document.getElementById('overlay'))closeSheet()}
function closeSheet(){document.getElementById('overlay').classList.remove('open')}

// ── Cover rendering ──────────────────────────────────────────
function coverHTML(item, width=40, height=56, large=false){
  const c=pubColor(item.publisher||'');
  if(item.cover_url){
    return `<div class="cover-wrap" style="width:${width}px;height:${height}px">
      <img src="${esc(item.cover_url)}" alt="" onerror="this.parentNode.innerHTML=spineHTML('${esc(initials(item.series||''))}','${esc(c.bg)}','${esc(c.fg)}',${width},${height})">
    </div>`;
  }
  return `<div class="cover-wrap" style="width:${width}px;height:${height}px;background:${c.bg}">
    <div class="cover-spine" style="color:${c.fg}">${initials(item.series||'?')}</div>
  </div>`;
}
function spineHTML(init,bg,fg,w,h){
  return `<div class="cover-wrap" style="width:${w}px;height:${h}px;background:${bg}"><div class="cover-spine" style="color:${fg}">${init}</div></div>`;
}
function detailCoverHTML(item){
  const c=pubColor(item.publisher||'');
  if(item.cover_url){
    return `<div class="detail-cover">
      <img src="${esc(item.cover_url)}" alt="${esc(item.title||item.missing||'')}" onerror="this.style.display='none';this.nextSibling.style.display='flex'">
      <div class="detail-cover-spine" style="background:${c.bg};color:${c.fg};display:none">${initials(item.series||'?')}</div>
    </div>`;
  }
  return `<div class="detail-cover" style="background:${c.bg}">
    <div class="detail-cover-spine" style="color:${c.fg}">${initials(item.series||'?')}</div>
  </div>`;
}

// ── Filter / group ───────────────────────────────────────────
function filterData(data){
  const q=document.getElementById('search').value.toLowerCase();
  return data.filter(item=>{
    const ms=activeFilter==='Tous'||item.series===activeFilter;
    if(!q)return ms;
    return ms&&Object.values(item).join(' ').toLowerCase().includes(q);
  });
}
function groupBy(arr,key){
  const g={};arr.forEach(i=>{if(!g[i[key]])g[i[key]]=[];g[i[key]].push(i)});return g;
}

// ── Render ───────────────────────────────────────────────────
function render(){
  renderChips();
  if(currentTab==='stats'){renderStats();return}
  if(currentTab==='config'){renderConfig();return}
  const data=currentTab==='owned'?ownedData:missingData;
  const filtered=filterData(data);
  const groups=groupBy(filtered,'series');
  const list=document.getElementById('list');
  if(!filtered.length){list.innerHTML=`<div class="empty"><div class="empty-icon">🔍</div><p>Aucun résultat</p></div>`;return}
  let html='';
  Object.keys(groups).sort().forEach(series=>{
    html+=`<div class="section-hdr">${esc(series)} <span style="font-weight:400;opacity:.6">(${groups[series].length})</span></div>`;
    groups[series].forEach(item=>{
      html+=currentTab==='owned'?renderOwned(item):renderMissing(item);
    });
  });
  list.innerHTML=html;
}

function renderOwned(item){
  const tome=item.tome&&item.tome!=='-'?` — T.${item.tome}`:'';
  return `<div class="book-item" onclick="openDetail('${esc(item.id)}','owned')">
    ${coverHTML(item)}
    <div class="book-info">
      <div class="book-title">${esc(item.title)}${esc(tome)}</div>
      <div class="book-sub">${esc(item.authors||'')}</div>
      <div class="badges">
        <span class="badge b-pub">${esc(item.publisher)}</span>
        <span class="badge b-owned">Possédé</span>
      </div>
    </div>
    <span class="chevron">›</span>
  </div>`;
}

function renderMissing(item){
  const priBadge=item.priority==='★★★'?'b-missing':item.priority==='★★'?'b-warn':'b-pub';
  const strike=item.acquired?'style="text-decoration:line-through;opacity:.5"':'';
  return `<div class="book-item" onclick="openDetail('${esc(item.id)}','missing')">
    <div style="width:40px;height:56px;border-radius:3px 5px 5px 3px;background:${item.acquired?'var(--success-bg)':'var(--danger-bg)'};display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:22px;box-shadow:2px 2px 6px rgba(0,0,0,.1)">
      ${item.acquired?'✅':'📋'}
    </div>
    <div class="book-info">
      <div class="book-title" ${strike}>${esc(item.missing)}</div>
      <div class="book-sub">${esc(item.authors||'')}</div>
      <div class="badges">
        <span class="badge b-pub">${esc(item.publisher)}</span>
        <span class="badge ${priBadge}">${esc(item.priority)}</span>
        ${item.acquired?'<span class="badge b-owned">Acquis ✓</span>':''}
      </div>
    </div>
    <button class="check-btn ${item.acquired?'on':''}" onclick="toggleAcquired(event,'${esc(item.id)}')">✓</button>
  </div>`;
}

function renderChips(){
  if(currentTab==='stats'||currentTab==='config'){document.getElementById('chips').innerHTML='';return}
  const data=currentTab==='owned'?ownedData:missingData;
  const series=['Tous',...[...new Set(data.map(d=>d.series))].sort()];
  document.getElementById('chips').innerHTML=series.map(s=>
    `<button class="chip ${s===activeFilter?'active':''}" onclick="setFilter(${JSON.stringify(s)})">${esc(s)}</button>`
  ).join('');
}

// ── Stats ─────────────────────────────────────────────────────
function renderStats(){
  document.getElementById('chips').innerHTML='';
  const acquiredCount=missingData.filter(m=>m.acquired).length;
  const totalMissing=missingData.length;
  const serCounts={};ownedData.forEach(b=>{serCounts[b.series]=(serCounts[b.series]||0)+1});
  const pubCounts={};ownedData.forEach(b=>{pubCounts[b.publisher]=(pubCounts[b.publisher]||0)+1});

  // Series completion: owned vs missing per series
  const allSeries=[...new Set([...ownedData.map(b=>b.series),...missingData.map(b=>b.series)])].sort();
  const completionData=allSeries.map(s=>{
    const owned=(serCounts[s]||0);
    const missing=missingData.filter(m=>m.series===s&&!m.acquired).length;
    const total=owned+missing;
    const pct=total>0?Math.round(owned/total*100):100;
    return{series:s,owned,missing,total,pct};
  }).filter(d=>d.total>0).sort((a,b)=>b.pct-a.pct);

  // Progress over time (acquired missing)
  const progressByPri={'★★★':0,'★★':0,'★':0};
  missingData.filter(m=>m.acquired).forEach(m=>{progressByPri[m.priority]=(progressByPri[m.priority]||0)+1});
  const stillMissingByPri={'★★★':0,'★★':0,'★':0};
  missingData.filter(m=>!m.acquired).forEach(m=>{stillMissingByPri[m.priority]=(stillMissingByPri[m.priority]||0)+1});

  const topPubs=Object.entries(pubCounts).sort((a,b)=>b[1]-a[1]);
  const pubLabels=topPubs.map(([p])=>p);
  const pubVals=topPubs.map(([,n])=>n);
  const pubBars=topPubs.map(([p])=>pubColor(p).bar);

  document.getElementById('list').innerHTML=`
    <div class="stats-scroll">
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-num">${ownedData.length}</div><div class="stat-lbl">Albums possédés</div></div>
        <div class="stat-card"><div class="stat-num">${totalMissing-acquiredCount}</div><div class="stat-lbl">Encore manquants</div></div>
        <div class="stat-card"><div class="stat-num">${Object.keys(serCounts).length}</div><div class="stat-lbl">Séries</div></div>
        <div class="stat-card"><div class="stat-num">${acquiredCount}</div><div class="stat-lbl">Manquants acquis</div></div>
      </div>

      <div class="chart-card">
        <div class="chart-title">Albums par éditeur</div>
        <div class="chart-wrap"><canvas id="chartPub"></canvas></div>
      </div>

      <div class="chart-card">
        <div class="chart-title">Manquants par priorité</div>
        <div class="chart-wrap"><canvas id="chartProgress"></canvas></div>
      </div>

      <div class="completion-card">
        <div class="chart-title" style="margin-bottom:10px">Complétion par série</div>
        ${completionData.map(d=>`
          <div class="comp-row">
            <span class="comp-name">${esc(d.series)}</span>
            <div class="comp-track"><div class="comp-fill" style="width:${d.pct}%;background:${d.pct===100?'var(--success)':d.pct>50?'var(--accent)':'var(--danger)'}"></div></div>
            <span class="comp-pct" style="color:${d.pct===100?'var(--success)':d.pct>50?'var(--accent-text)':'var(--danger)'}">${d.pct}%</span>
          </div>`).join('')}
      </div>
    </div>`;

  // Draw charts after DOM is ready
  setTimeout(()=>{
    const isDark=window.matchMedia('(prefers-color-scheme: dark)').matches;
    const textColor=isDark?'#9a9990':'#6b6a64';
    const gridColor=isDark?'rgba(255,255,255,0.06)':'rgba(0,0,0,0.06)';

    // Donut — publishers
    if(chartPub)chartPub.destroy();
    const ctxP=document.getElementById('chartPub');
    if(ctxP)chartPub=new Chart(ctxP,{
      type:'doughnut',
      data:{labels:pubLabels,datasets:[{data:pubVals,backgroundColor:pubBars,borderWidth:2,borderColor:isDark?'#1c1c1a':'#fff'}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{color:textColor,font:{size:11},boxWidth:12,padding:8}}},cutout:'60%'}
    });

    // Grouped bar — missing by priority
    if(chartProgress)chartProgress.destroy();
    const ctxPr=document.getElementById('chartProgress');
    if(ctxPr)chartProgress=new Chart(ctxPr,{
      type:'bar',
      data:{
        labels:['★★★ Urgent','★★ Souhaité','★ Optionnel'],
        datasets:[
          {label:'Encore manquant',data:[stillMissingByPri['★★★'],stillMissingByPri['★★'],stillMissingByPri['★']],backgroundColor:'#c0000088',borderRadius:4},
          {label:'Acquis',data:[progressByPri['★★★'],progressByPri['★★'],progressByPri['★']],backgroundColor:'#1a6b3a88',borderRadius:4}
        ]
      },
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:textColor,font:{size:11}}}},
        scales:{x:{ticks:{color:textColor,font:{size:10}},grid:{color:gridColor}},y:{ticks:{color:textColor,font:{size:11},stepSize:1},grid:{color:gridColor},beginAtZero:true}}}
    });
  },100);
}

// ── Config ────────────────────────────────────────────────────
function renderConfig(){
  const connected=!!SCRIPT_URL;
  document.getElementById('chips').innerHTML='';
  document.getElementById('list').innerHTML=`
    <div style="padding:20px 16px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
        <span style="font-size:16px;font-weight:600">Google Sheet</span>
        <span class="cfg-badge ${connected?'':'disconnected'}">${connected?'Connecté':'Non connecté'}</span>
      </div>
      <label class="form-label">URL Web App</label>
      <input class="form-field" id="cfg-url" type="url" value="${esc(SCRIPT_URL)}" placeholder="https://script.google.com/macros/s/…/exec">
      <button class="btn-main" style="width:100%;margin-top:8px" onclick="updateConfig()">Mettre à jour</button>
      ${connected?`<button class="btn-ghost" style="width:100%;margin-top:10px" onclick="syncData()">↻ Synchroniser</button>`:''}
    </div>`;
}
function updateConfig(){
  const url=document.getElementById('cfg-url').value.trim();
  if(!url){SCRIPT_URL='';localStorage.removeItem(SCRIPT_URL_KEY);toast('Déconnecté');render();return}
  if(!url.startsWith('https://script.google.com')){toast('URL invalide');return}
  SCRIPT_URL=url;localStorage.setItem(SCRIPT_URL_KEY,url);
  toast('URL mise à jour ✓');syncData();
}

// ── Detail sheet ──────────────────────────────────────────────

  if(!item)return;
  let html='';

    const tome=item.tome&&item.tome!=='-'?item.tome:'—';
    html=`
      ${detailCoverHTML(item)}
      <div class="sheet-title">${esc(item.title)}</div>
      <div class="sheet-sub">${esc(item.series)}</div>
      <div class="sheet-row"><span class="s-label">Tome</span><span class="s-val">${esc(tome)}</span></div>
      <div class="sheet-row"><span class="s-label">Éditeur</span><span class="s-val">${esc(item.publisher||'—')}</span></div>
      <div class="sheet-row"><span class="s-label">Auteur(s)</span><span class="s-val">${esc(item.authors||'—')}</span></div>
      <div class="sheet-row"><span class="s-label">Rayon</span><span class="s-val">${esc(item.shelf||'—')}</span></div>
      ${item.notes?`<div class="sheet-row"><span class="s-label">Notes</span><span class="s-val">${esc(item.notes)}</span></div>`:''}
      <div class="sheet-actions">

        <button class="btn-edit" onclick="openEdit('${esc(id)}','owned')">✏️ Éditer</button>
        <button class="btn-main" onclick="closeSheet()">Fermer</button>
      </div>`;
  }else{
    html=`
      <div class="sheet-title">${esc(item.missing)}</div>
      <div class="sheet-sub">${esc(item.series)}</div>
      <div class="sheet-row"><span class="s-label">Éditeur</span><span class="s-val">${esc(item.publisher||'—')}</span></div>
      <div class="sheet-row"><span class="s-label">Auteur(s)</span><span class="s-val">${esc(item.authors||'—')}</span></div>
      <div class="sheet-row"><span class="s-label">Priorité</span><span class="s-val">${esc(item.priority||'—')}</span></div>
      <div class="sheet-row"><span class="s-label">Notes</span><span class="s-val">${esc(item.notes||'—')}</span></div>
      <div class="sheet-row"><span class="s-label">Statut</span><span class="s-val" style="color:${item.acquired?'var(--success)':'var(--danger)'}">${item.acquired?'Acquis ✓':'Non acquis'}</span></div>
      <div class="sheet-actions">
        <button class="btn-danger" onclick="deleteItem('${esc(id)}','missing')">🗑</button>
        <button class="btn-edit" onclick="openEdit('${esc(id)}','missing')">✏️ Éditer</button>
        <button class="btn-main" onclick="toggleAcquiredFromDetail('${esc(id)}')">${item.acquired?'Non acquis':'Acquis ✓'}</button>
      </div>`;
  }
  document.getElementById('sheet-content').innerHTML=html;
  document.getElementById('overlay').classList.add('open');
}

// ── Edit form ─────────────────────────────────────────────────
function openEdit(id, type){
  const item=type==='owned'?ownedData.find(i=>String(i.id)===String(id)):missingData.find(i=>String(i.id)===String(id));
  if(!item)return;
  let html='';
  if(type==='owned'){
    const coverVal=item.cover_url||'';
    html=`
      <div class="sheet-title">✏️ Éditer l'album</div>
      <div style="height:12px"></div>
      <div id="cover-preview-wrap" class="cover-preview">
        ${coverVal?`<img src="${esc(coverVal)}" alt="" onerror="this.parentNode.innerHTML='<div class=cover-preview-placeholder>URL invalide</div>'">`:'<div class="cover-preview-placeholder">📸 Collez une URL de couverture ci-dessous</div>'}
      </div>
      <label class="form-label">URL Couverture</label>
      <input class="form-field" id="e-cover" type="url" value="${esc(coverVal)}" placeholder="https://…/cover.jpg" oninput="previewCover(this.value)">
      <label class="form-label">Série *</label>
      <input class="form-field" id="e-series" value="${esc(item.series||'')}">
      <label class="form-label">Titre *</label>
      <input class="form-field" id="e-title" value="${esc(item.title||'')}">
      <div class="form-row">
        <div><label class="form-label">Tome</label><input class="form-field" id="e-tome" value="${esc(item.tome||'')}"></div>
        <div><label class="form-label">Éditeur</label><input class="form-field" id="e-pub" value="${esc(item.publisher||'')}"></div>
      </div>
      <label class="form-label">Auteur(s)</label>
      <input class="form-field" id="e-authors" value="${esc(item.authors||'')}">
      <label class="form-label">Notes</label>
      <input class="form-field" id="e-notes" value="${esc(item.notes||'')}">
      <div class="sheet-actions">
        <button class="btn-ghost" onclick="openDetail('${esc(id)}','owned')">Annuler</button>
        <button class="btn-main" onclick="saveEdit('${esc(id)}','owned')">Enregistrer</button>
      </div>`;
  }else{
    html=`
      <div class="sheet-title">✏️ Éditer le manquant</div>
      <div style="height:12px"></div>
      <label class="form-label">Série *</label>
      <input class="form-field" id="e-series" value="${esc(item.series||'')}">
      <label class="form-label">Tome(s) manquant(s) *</label>
      <input class="form-field" id="e-title" value="${esc(item.missing||'')}">
      <div class="form-row">
        <div><label class="form-label">Éditeur</label><input class="form-field" id="e-pub" value="${esc(item.publisher||'')}"></div>
        <div><label class="form-label">Priorité</label>
          <select class="form-field" id="e-priority">
            <option ${item.priority==='★★★'?'selected':''}>★★★</option>
            <option ${item.priority==='★★'?'selected':''}>★★</option>
            <option ${item.priority==='★'?'selected':''}>★</option>
          </select>
        </div>
      </div>
      <label class="form-label">Auteur(s)</label>
      <input class="form-field" id="e-authors" value="${esc(item.authors||'')}">
      <label class="form-label">Notes</label>
      <input class="form-field" id="e-notes" value="${esc(item.notes||'')}">
      <div class="sheet-actions">
        <button class="btn-ghost" onclick="openDetail('${esc(id)}','missing')">Annuler</button>
        <button class="btn-main" onclick="saveEdit('${esc(id)}','missing')">Enregistrer</button>
      </div>`;
  }
  document.getElementById('sheet-content').innerHTML=html;
}

function previewCover(url){
  const wrap=document.getElementById('cover-preview-wrap');
  if(!wrap)return;
  if(url){
    wrap.innerHTML=`<img src="${esc(url)}" alt="" onerror="this.parentNode.innerHTML='<div class=cover-preview-placeholder>URL invalide</div>'">`;
  }else{
    wrap.innerHTML='<div class="cover-preview-placeholder">📸 Collez une URL de couverture ci-dessous</div>';
  }
}

async function saveEdit(id, type){
  if(type==='owned'){
    const item=ownedData.find(i=>String(i.id)===String(id));
    if(!item)return;
    item.series=document.getElementById('e-series').value.trim();
    item.title=document.getElementById('e-title').value.trim();
    item.tome=document.getElementById('e-tome').value.trim()||'-';
    item.publisher=document.getElementById('e-pub').value.trim();
    item.authors=document.getElementById('e-authors').value.trim();
    item.notes=document.getElementById('e-notes').value.trim();
    item.cover_url=document.getElementById('e-cover').value.trim();
    if(!item.series||!item.title){toast('Série et titre requis');return}
    closeSheet();render();
    await post({action:'save_owned',data:ownedData});
  }else{
    const item=missingData.find(i=>String(i.id)===String(id));
    if(!item)return;
    item.series=document.getElementById('e-series').value.trim();
    item.missing=document.getElementById('e-title').value.trim();
    item.publisher=document.getElementById('e-pub').value.trim();
    item.authors=document.getElementById('e-authors').value.trim();
    item.priority=document.getElementById('e-priority').value;
    item.notes=document.getElementById('e-notes').value.trim();
    if(!item.series||!item.missing){toast('Série et titre requis');return}
    closeSheet();render();
    await post({action:'save_missing',data:missingData});
  }
  toast('Modifié ✓');
}

function openAdd(){
  const isM=currentTab==='missing';
  document.getElementById('sheet-content').innerHTML=`
    <div class="sheet-title">${isM?'Ajouter un manquant':'Ajouter un album'}</div>
    <div style="height:12px"></div>
    ${!isM?`
    <div id="cover-preview-wrap" class="cover-preview">
      <div class="cover-preview-placeholder">📸 Collez une URL de couverture ci-dessous</div>
    </div>
    <label class="form-label">URL Couverture</label>
    <input class="form-field" id="f-cover" type="url" placeholder="https://…/cover.jpg" oninput="previewCover(this.value)">
    `:''}
    <label class="form-label">Série *</label>
    <input class="form-field" id="f-series" placeholder="ex. Blake & Mortimer">
    <label class="form-label">${isM?'Tome(s) manquant(s) *':'Titre *'}</label>
    <input class="form-field" id="f-title" placeholder="${isM?'ex. 1 – L\'Espadon':'ex. La Marque Jaune'}">

      <div><label class="form-label">Tome</label><input class="form-field" id="f-tome" placeholder="ex. 5"></div>
      <div><label class="form-label">Éditeur</label><input class="form-field" id="f-pub" placeholder="ex. Glénat"></div>

    <label class="form-label">Auteur(s)</label>
    <input class="form-field" id="f-authors" placeholder="ex. E.P. Jacobs">

    <select class="form-field" id="f-priority">
      <option value="★★★">★★★ Urgent</option>
      <option value="★★" selected>★★ Souhaité</option>

    </select>`:''}
    <label class="form-label">Notes</label>
    <input class="form-field" id="f-notes" placeholder="Remarques…">
    <div class="sheet-actions">
      <button class="btn-ghost" onclick="closeSheet()">Annuler</button>
      <button class="btn-main" onclick="saveNew(${isM})">Ajouter</button>
    </div>`;
  document.getElementById('overlay').classList.add('open');
}

async function saveNew(isMissing){
  const series=document.getElementById('f-series').value.trim();
  const title=document.getElementById('f-title').value.trim();
  if(!series||!title){toast('Série et titre requis');return}
  const id=(isMissing?'m':'o')+Date.now();
  const notes=document.getElementById('f-notes').value.trim();
  const pub=document.getElementById('f-pub').value.trim();
  const auth=document.getElementById('f-authors').value.trim();
  if(isMissing){
    const item={id,series,missing:title,publisher:pub,authors:auth,priority:document.getElementById('f-priority').value,acquired:false,notes};
    missingData.push(item);closeSheet();updateCounts();render();
    await post({action:'add_missing',item});
  }else{
    const item={id,series,title,tome:(document.getElementById('f-tome').value.trim()||'-'),publisher:pub,authors:auth,shelf:'Manuel',notes,cover_url:(document.getElementById('f-cover').value.trim()||'')};
    ownedData.push(item);closeSheet();updateCounts();render();
    await post({action:'add_owned',item});
  }
  toast('Ajouté ✓');
}

// ── Actions ───────────────────────────────────────────────────
async function toggleAcquired(e,id){
  e.stopPropagation();
  const item=missingData.find(i=>String(i.id)===String(id));
  if(!item)return;
  item.acquired=!item.acquired;updateCounts();render();
  await post({action:'toggle_acquired',id,value:item.acquired});
  toast(item.acquired?'Marqué acquis ✓':'Marqué non acquis');
}
async function toggleAcquiredFromDetail(id){
  const item=missingData.find(i=>String(i.id)===String(id));
  if(!item)return;
  item.acquired=!item.acquired;closeSheet();updateCounts();render();
  await post({action:'toggle_acquired',id,value:item.acquired});
  toast(item.acquired?'Marqué acquis ✓':'Marqué non acquis');
}
async function deleteItem(id,type){
  if(!confirm('Supprimer cet album ?'))return;
  if(type==='owned')ownedData=ownedData.filter(i=>String(i.id)!==String(id));
  else missingData=missingData.filter(i=>String(i.id)!==String(id));
  closeSheet();updateCounts();render();
  await post({action:'delete',id,type});
  toast('Supprimé');
}

checkSetup();
